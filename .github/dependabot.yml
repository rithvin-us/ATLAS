version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      genkit:
        patterns: ["genkit", "@genkit-ai/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
